# Builds and pushes the pdfsign + bot images for release tags like `0.5.3` (no `v` prefix).
#
# Default target is this project's GitLab Container Registry (no setup needed).
# For another registry (e.g. Docker Hub), set these CI/CD variables in the project settings:
#   REGISTRY           e.g. docker.io
#   REGISTRY_USER      registry user
#   REGISTRY_PASSWORD  access token (masked + protected)
#   APP_IMAGE          e.g. docker.io/myuser/pdfsign
#   BOT_IMAGE          e.g. docker.io/myuser/pdfsign-bot
#
# Pushed tags: `0.5.3`, `0.5` and `latest`.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
    # merge requests (e.g. the weekly Renovate MR) run the test stage only
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  REGISTRY: $CI_REGISTRY
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  APP_IMAGE: $CI_REGISTRY_IMAGE
  BOT_IMAGE: $CI_REGISTRY_IMAGE/bot

stages:
  - test
  - build

# ---------------------------------------------------------------------------------------
# Tests (a broken tag never produces an image)

test:server:
  stage: test
  image: rust:1.100.0-slim-trixie
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo/registry, server/target]
  script:
    - cd server
    - cargo test --locked

test:web:
  stage: test
  image: oven/bun:1.4.5
  script:
    - cd web
    - bun install --frozen-lockfile
    - bunx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
    - bun run build

test:bot:
  stage: test
  image: oven/bun:1.4.5
  script:
    - cd bot
    - bun install --frozen-lockfile
    - bunx tsc --noEmit

# ---------------------------------------------------------------------------------------
# Container images

.docker:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  image: docker:29.10.1
  services:
    - docker:29.10.1-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - test -n "$REGISTRY_PASSWORD" || { echo "REGISTRY_PASSWORD is empty"; exit 1; }
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin "$REGISTRY"
    - docker buildx create --use --driver docker-container --driver-opt image=moby/buildkit:v0.35.1
  script:
    - MINOR="${CI_COMMIT_TAG%.*}"
    - echo "Building $IMAGE:$CI_COMMIT_TAG (+ $MINOR, latest) from $CONTEXT/$DOCKERFILE"
    - >
      docker buildx build --push
      --file "$CONTEXT/$DOCKERFILE"
      --build-arg VERSION="$CI_COMMIT_TAG"
      --label org.opencontainers.image.version="$CI_COMMIT_TAG"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      --label org.opencontainers.image.created="$CI_PIPELINE_CREATED_AT"
      --cache-from type=registry,ref="$IMAGE:buildcache"
      --cache-to type=registry,ref="$IMAGE:buildcache",mode=max
      --tag "$IMAGE:$CI_COMMIT_TAG"
      --tag "$IMAGE:$MINOR"
      --tag "$IMAGE:latest"
      "$CONTEXT"

build:app:
  extends: .docker
  needs: [test:server, test:web]
  variables:
    IMAGE: $APP_IMAGE
    CONTEXT: .
    DOCKERFILE: Dockerfile

build:bot:
  extends: .docker
  needs: [test:bot]
  variables:
    IMAGE: $BOT_IMAGE
    CONTEXT: bot
    DOCKERFILE: Dockerfile
